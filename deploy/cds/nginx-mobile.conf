server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    location = / { return 302 /h5/; }
    location = /h5 { return 302 /h5/; }
    location = /h5/index.html { add_header Cache-Control "no-cache"; }
    location = /h5/build-info.json { add_header Cache-Control "no-store"; }
    location /h5/assets/ { try_files $uri =404; }
    location /h5/ { try_files $uri $uri/ /h5/index.html; }
    location / { return 404; }
}
