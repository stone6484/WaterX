spring:
  application:
    name: safety-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/safety}
    username: ${DATABASE_USERNAME:safety}
    password: ${DATABASE_PASSWORD:change_me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 110MB
server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
app:
  auth:
    access-token-minutes: 30
    refresh-token-days: 14
  bootstrap:
    admin-username: ${BOOTSTRAP_ADMIN_USERNAME:}
    admin-password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  storage:
    local-dir: ${FILE_STORAGE_DIR:./data/uploads}
